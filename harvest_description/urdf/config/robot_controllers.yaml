controller_manager:
  ros__parameters:
    update_rate: 1000  # Increased controller loop rate; 100Hz was causing too much jitter
    # motion controller must evaluate the 7-phase equations at a high enough frequency to prevent discretization jitter.

    # Broadcasts the current positions of the joints to the network
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controls all 6 degrees of freedom as a grouped trajectory segment
    # Change type to an effort commander group if sending calculated math feeds directly
    effort_controller:
      type: effort_controllers/JointGroupEffortController

effort_controller:
  ros__parameters:
    joints:
      - rail_joint
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    open_loop_control: false # Set to false to force Gazebo to use the PID closed-loop tracking feedback

    # PID gains are applied by gravity_compensation_node, not this effort-command controller.
