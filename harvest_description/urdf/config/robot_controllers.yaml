controller_manager:
  ros__parameters:
    update_rate: 2000  # Increased controller loop rate; 100Hz was causing too much jitter
    # motion controller must evaluate the 7-phase equations at a high enough frequency to prevent discretization jitter.

    # Broadcasts the current positions of the joints to the network
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controls all 6 degrees of freedom as a grouped trajectory segment
    # Change type to an effort commander group if sending calculated math feeds directly
    effort_controller:
      type: effort_controllers/JointGroupEffortController

effort_controller:
  ros__parameters:
    joints:
      - rail_joint
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    open_loop_control: false # Set to false to force Gazebo to use the PID closed-loop tracking feedback

    # INJECTING PID GAINS
    # This instructs the simulator to execute corrections using your original design parameters
    # Kp: Drives the link quickly toward the berry cluster.
    # <-- If too low, arm will sag; if too high, violent shaking and oscillations
    # Ki: Fights the structural gravity drop to hit precise coordinates
    # <-- If too low, arm will stop short of the berry coordinate; if too high, unstable drifting and overshooting
    # Kd: Smooths out acceleration so the gripper approaches softly
    # If too low, overshooting targets and arm will jerk aggressively; if too high, joints will be too stiff and buzz loudly.  
    # Kd << This is the most sensitive parameter to tune, so adjust carefully.
    
    # Updated 
    gains:
      # Best results after manual tuning
      rail_joint:        {p: 1200.0, i: 10.0, d: 50.0, i_clamp: 10.0}
      base_joint:        {p: 80.0, i: 0.0, d: 0.0, i_clamp: 0.0} # accurate
      shoulder_joint:    {p: 150.0, i: 15.0, d: 1.0, i_clamp:  15.0} # reduce i and d gains to improve accuracy and reduce oscillations
      elbow_joint:       {p: 100.0, i: 10.0, d: 1.0, i_clamp: 10.0} # increasing d too high causes jitter
      wrist_pitch_joint: {p: 50.0, i: 5.0, d: 0.5, i_clamp: 5.0} # increasing i gain too high causes overshoot
      wrist_roll_joint:  {p: 10.0, i: 0.0, d: 0.0, i_clamp: 0.0}
      
      # we zeroed the i gains to reduce integral windup, the shoulder joint still overshoots
      # we changed the gc calc of shoulder joint to read desired stated instead of actual states.
