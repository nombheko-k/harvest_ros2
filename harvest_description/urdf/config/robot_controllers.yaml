controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Broadcasts the current positions of the joints to the network
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controls all 6 degrees of freedom as a grouped trajectory segment
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - rail_joint
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: false # Set to false to force Gazebo to use the PID closed-loop tracking feedback

    # INJECTING PID GAINS
    # This instructs the simulator to execute corrections using our design parameters
    gains:
      rail_joint:        {p: 500.0, i: 1.0,  d: 25.0}  # Heavy rail requires higher proportional force
      base_joint:        {p: 2.5,   i: 0.01, d: 0.15}  # Matches teammate's exact tuning profile
      shoulder_joint:    {p: 2.5,   i: 0.01, d: 0.15}  # Matches teammate's exact tuning profile
      elbow_joint:       {p: 2.5,   i: 0.01, d: 0.15}  # Matches teammate's exact tuning profile
      wrist_pitch_joint: {p: 2.5,   i: 0.01, d: 0.15}  # Matches teammate's exact tuning profile
      wrist_roll_joint:  {p: 2.5,   i: 0.01, d: 0.15}  # Matches teammate's exact tuning profile
