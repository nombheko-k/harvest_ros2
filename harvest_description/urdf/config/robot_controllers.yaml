controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Broadcasts the current positions of the joints to the network
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controls all 6 degrees of freedom as a grouped trajectory segment
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - rail_joint
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
