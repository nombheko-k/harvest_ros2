controller_manager:
  ros__parameters:
    update_rate: 100  # Hz - Matches the ESP32's 10ms execution loop timeline

    # Broadcasts the current positions of the joints to the network
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controls all 6 degrees of freedom as a grouped trajectory segment
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - rail_joint
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: false # Set to false to force Gazebo to use the PID closed-loop tracking feedback

    # INJECTING PID GAINS
    # This instructs the simulator to execute corrections using your original design parameters
    # Kp: If too low, arm will feel weak; if too high, arm will oscillate and overshoot
    # Ki: If too low, arm will experience steady-state error; if too high robot will overshoot the target and drift out of control
    # Kd: If too low, arm will jerk aggressively; if too high, joints will be too stiff and unresponsive.  
    # Kd << This is the most sensitive parameter to tune, so adjust carefully.
    
    # Updated 
    gains:
      # Rail: Unchanged, easily handles the base carriage
      rail_joint:        {p: 1200.0, i: 5.0,  d: 50.0}
      
      # Base: Slight P bump to swing the higher rotational inertia
      base_joint:        {p: 600.0,  i: 1.0,  d: 40.0}
      
      # Shoulder: Massive P and I increase to lift the new cantilevered mass
      shoulder_joint:    {p: 1500.0, i: 20.0, d: 80.0}
      
      # Elbow: Doubled muscle to manage the heavy wrist/tool assembly
      elbow_joint:       {p: 1000.0, i: 10.0, d: 60.0}
      
      # Wrist Pitch: Increased to support the 0.575kg roll actuator
      wrist_pitch_joint: {p: 250.0,  i: 5.0,  d: 15.0}
      
      # Wrist Roll: Minor dampening adjustments
      wrist_roll_joint:  {p: 50.0,   i: 0.1,  d: 2.0}